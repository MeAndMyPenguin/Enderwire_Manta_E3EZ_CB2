[gcode_macro _CUSTOM_VARIABLES]
variable_material               : ""
variable_vendor                 : ""
variable_bed_temp               : 0.0
variable_retraction             : 0.0
variable_retraction_speed       : 0.0

variable_pla_offset             : 0.050
variable_pla_retraction         : 0.1
variable_pla_retraction_speed   : 20

variable_petg_offset            : -0.020
variable_petg_retraction        : 0.4
variable_petg_retraction_speed  : 30

variable_tpu_offset             : 0.010
variable_tpu_retraction         : 0.4
variable_tpu_retraction_speed   : 10

variable_abs_offset             : -0.020
variable_abs_retraction         : 0.1
variable_abs_retraction_speed   : 20

variable_asa_offset             : -0.020
variable_asa_retraction         : 0.3
variable_asa_retraction_speed   : 30

gcode:

[gcode_macro BED_SOAK]
gcode:
  {% set variables = printer["gcode_macro _CUSTOM_VARIABLES"] %}

  M118 Bed Soak macro. Filament material is {variables.material}. Vendor is {variables.vendor}.
  M118 Heating bed to: {variables.bed_temp}c                                                       # Display info
  M190 S{variables.bed_temp}                                                                       # Set target temp for the bed

  {% if variables.material == "PLA" %}                                                             # Heat soak bed if material is anything but ABS or ASA
    M118 Waiting for bed to be within 5 degrees of {variables.bed_temp}                            # Display info
    TEMPERATURE_WAIT SENSOR="temperature_sensor Bed_Top" MINIMUM={variables.bed_temp - 5}          # Waits for bed surface to be within 5 degrees of target bed

  {% elif variables.material == "PETG" %}
    M118 Waiting for bed to be within 5 degrees of {variables.bed_temp}                            # Display info
    TEMPERATURE_WAIT SENSOR="temperature_sensor Bed_Top" MINIMUM={variables.bed_temp - 5}          # Waits for bed surface to be within 5 degrees of target bed

  {% elif variables.material == "TPU" %}
    M118 Waiting for bed to be within 5 degrees of {variables.bed_temp}                            # Display info
    TEMPERATURE_WAIT SENSOR="temperature_sensor Bed_Top" MINIMUM={variables.bed_temp - 5}          # Waits for bed surface to be within 5 degrees of target bed

  {% endif %}

[gcode_macro SET_MATERIAL]
gcode:
  {% set variables = printer["gcode_macro _CUSTOM_VARIABLES"] %}

  {% if variables.material == "PLA" %}
    M118 Filament material is {variables.material}. Vendor is {variables.vendor}. Setting Z-Offset to {variables.pla_offset}mm. Retraction amount to {variables.pla_retraction}mm. Retraction speed to {variables.pla_retraction_speed}mm/s.
    SET_GCODE_OFFSET Z={variables.pla_offset}
    SET_RETRACTION RETRACT_LENGTH={variables.pla_retraction}
    SET_RETRACTION RETRACT_SPEED={variables.pla_retraction_speed}
    
  {% elif variables.material == "PETG" %}
    M118 Filament material is {variables.material}. Vendor is {variables.vendor}. Setting Z-Offset to {variables.petg_offset}mm. Retraction amount to {variables.petg_retraction}mm. Retraction speed to {variables.petg_retraction_speed}mm/s.
    SET_GCODE_OFFSET Z={variables.petg_offset}
    SET_RETRACTION RETRACT_LENGTH={variables.petg_retraction}
    SET_RETRACTION RETRACT_SPEED={variables.petg_retraction_speed}
    
  {% elif variables.material == "TPU" %}
    M118 Filament material is {variables.material}. Vendor is {variables.vendor}. Setting Z-Offset to {variables.tpu_offset}mm. Retraction amount to {variables.tpu_retraction}mm. Retraction speed to {variables.tpu_retraction_speed}mm/s.
    SET_GCODE_OFFSET Z={variables.tpu_offset}
    SET_RETRACTION RETRACT_LENGTH={variables.tpu_retraction}
    SET_RETRACTION RETRACT_SPEED={variables.tpu_retraction_speed}
    
  {% elif variables.material == "ABS" %}
    M118 Filament material is {variables.material}. Vendor is {variables.vendor}. Setting Z-Offset to {variables.abs_offset}mm. Retraction amount to {variables.abs_retraction}mm. Retraction speed to {variables.abs_retraction_speed}mm/s.
    SET_GCODE_OFFSET Z={variables.abs_offset}
    SET_RETRACTION RETRACT_LENGTH={variables.abs_retraction}
    SET_RETRACTION RETRACT_SPEED={variables.abs_retraction_speed}
    
  {% elif variables.material == "ASA" %}
    M118 Filament material is {variables.material}. Vendor is {variables.vendor}. Setting Z-Offset to {variables.asa_offset}mm. Retraction amount to {variables.retraction}mm. Retraction speed to {variables.retraction_speed}mm/s.
    {% if variables.vendor == "Polymaker" %}
      SET_GCODE_OFFSET Z={variables.asa_offset}
      #SET_RETRACTION RETRACT_LENGTH={variables.asa_retraction}
      #SET_RETRACTION RETRACT_SPEED={variables.asa_retraction_speed}

    {% elif variables.vendor == "Flashforge" %}
      SET_GCODE_OFFSET Z={variables.asa_offset}
      SET_RETRACTION RETRACT_LENGTH={variables.asa_retraction}
      SET_RETRACTION RETRACT_SPEED={variables.asa_retraction_speed}
      
    {% endif %}
    
  {% else %}
    M118 No material set
    
  {% endif %}